name: DreamGrind Growth quality checks

on:
  push:
    branches: [main, growth-2.1-completion, premium-motion-commerce, commerce-growth-finalization]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks and release integrity tests
        run: npm test
